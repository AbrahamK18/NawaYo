<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anima — Reimposta password</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="screen-auth" style="min-height:100vh;">
    <div class="seal"></div>
    <h1 class="brand display">Anima</h1>
    <p class="tagline">Reimposta la tua password</p>
    <div class="auth-box">
      <input id="new-password" type="password" placeholder="Nuova password (min. 6 caratteri)" />
      <div class="error hidden" id="reset-error"></div>
      <div class="info-msg hidden" id="reset-info"></div>
      <button class="btn-primary btn-gold" id="reset-submit" onclick="handleResetPassword()">Salva nuova password</button>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
