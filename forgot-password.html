<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anima — Password dimenticata</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="screen-auth" style="min-height:100vh;">
    <div class="seal"></div>
    <h1 class="brand display">Anima</h1>
    <p class="tagline">Recupera la tua password</p>
    <div class="auth-box">
      <input id="forgot-email" type="email" placeholder="La tua email" autocomplete="email" />
      <div class="error hidden" id="forgot-error"></div>
      <div class="info-msg hidden" id="forgot-info"></div>
      <button class="btn-primary btn-gold" id="forgot-submit" onclick="handleSendReset()">Invia link di reset</button>
      <p class="disclaimer" style="text-align:center;"><a href="index.html" style="color:#D8C6BE;">← Torna al login</a></p>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
